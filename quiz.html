<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全小測驗｜交通安全知識學習站</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<h1>📝 交通安全小測驗</h1>
<p>挑戰你的交通安全知識！</p>
<a href="index.html">回首頁</a>
</header>

<main>
<h2>交通安全知識挑戰：共 10 題</h2>
<form id="quiz">

<script>
const questions = [
["行人過馬路應該走哪裡？",
["行人穿越道","車道中央","任意穿越道路"],0],
["騎乘機車時，安全帽應該如何配戴？",
["掛在手把上","戴好並扣緊帽帶","只戴不扣"],1],
["遇到紅燈時應該怎麼做？",
["加速通過","停下等待","直接左轉"],1],
["雨天騎車時應該？",
["減速慢行","加速通過","突然煞車"],0],
["看到停車再開標誌時應該？",
["直接通過","完全停車並確認安全","按喇叭後通過"],1],
["接近沒有號誌的路口時應該？",
["加速通過","不必觀察","減速並注意其他車輛"],2],
["騎車時可以一邊看手機嗎？",
["可以","不可以","只要速度慢就可以"],1],
["夜間行走時，穿著什麼較容易被看見？",
["深色衣物","明亮或反光衣物","完全不需要注意"],1],
["遇到大型車輛轉彎時，應該？",
["靠近車身旁邊","保持安全距離並避開視線死角","從內側搶先通過"],1],
["經過學校附近時，駕駛人應該？",
["減速並注意學生","加速離開","持續按喇叭"],0]
];

const form = document.getElementById("quiz");

questions.forEach((q, i) => {
  const section = document.createElement("section");
  section.innerHTML = `
    <h3>${i + 1}. ${q[0]}</h3>
    ${q[1].map((option, j) => `
      <label>
        <input type="radio" name="q${i}" value="${j}">
        ${option}
      </label><br>
    `).join("")}
  `;
  form.appendChild(section);
});
</script>

<button type="button" onclick="checkAnswer()">送出答案</button>
</form>

<h2 id="result"></h2>
</main>

<footer>
<p>交通安全知識學習站｜安全上路，從知識開始！</p>
</footer>

<script>
function checkAnswer() {
  let score = 0;

  for (let i = 0; i < questions.length; i++) {
    const answer = document.querySelector(
      'input[name="q' + i + '"]:checked'
    );

    if (!answer) {
      alert("還有題目尚未回答，請完成全部 10 題！");
      return;
    }

    if (Number(answer.value) === questions[i][2]) {
      score++;
    }
  }

  let message = score === 10
    ? "太厲害了！你是交通安全小達人！"
    : score >= 7
    ? "表現不錯！繼續保持安全觀念！"
    : "再多學習交通安全知識，下次會更好！";

  document.getElementById("result").textContent =
    "你的成績：" + score + " / 10 分。 " + message;
}
</script>
</body>
</html>
