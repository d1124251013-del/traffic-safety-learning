<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行人安全｜交通安全知識學習站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🚶 行人安全</h1>
    <p>保護自己，也尊重每一位用路人</p>
    <a href="index.html">回首頁</a>
  </header>

  <main>
    <h2>行人安全注意事項</h2>

    <section>
      <h3>1. 遵守交通號誌</h3>
      <p>過馬路時應遵守行人號誌，確認綠燈後再通行。</p>
    </section>

    <section>
      <h3>2. 走行人穿越道</h3>
      <p>過馬路應使用行人穿越道，不任意穿越車道。</p>
    </section>

    <section>
      <h3>3. 注意左右來車</h3>
      <p>通過路口前，先停下來觀察左右來車，確認安全再通過。</p>
    </section>

    <section>
      <h3>4. 避免分心</h3>
      <p>行走時不要一直看手機或戴耳機，以免忽略周遭交通狀況。</p>
    </section>

    <section>
      <h3>5. 夜間提高能見度</h3>
      <p>夜間或光線不足時，可穿著明亮衣物或使用反光配件。</p>
    </section>
  </main>

  <footer>
    <p>交通安全知識學習站｜安全上路，從知識開始！</p>
  </footer>
</body>
</html>
