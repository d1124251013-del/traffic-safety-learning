<main>
<h2>常見交通標誌</h2>
<section>
<h3>🔴 停車再開</h3>
<p>看到停車標誌時，必須完全停車，確認安全後才能通過。</p>
</section>
<section>
<h3>⚠️ 注意行人</h3>
<p>提醒駕駛人注意前方行人，經過時應減速慢行。</p>
</section>
<section>
<h3>🚫 禁止進入</h3>
<p>表示禁止車輛進入該路段，駕駛人應遵守標誌指示。</p>
</section>
<section>
<h3>⬅️ 單行道</h3>
<p>提醒用路人只能依照指定方向行駛。</p>
</section>
<section>
<h3>🚸 學校附近</h3>
<p>提醒駕駛人附近可能有學生通行，應減速並注意安全。</p>
</section>
</main>
<footer>
<p>交通安全知識學習站｜安全上路，從知識開始！</p>
</footer>
