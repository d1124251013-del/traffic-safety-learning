<header>
<h1>🏍️ 機車安全</h1>
<p>騎車不搶快，平安最重要</p>
<a href="index.html">回首頁</a>
</header>
<main>
<h2>安全騎乘注意事項</h2>
<section>
<h3>1. 正確配戴安全帽</h3>
<p>騎乘機車時應配戴合格安全帽，並確實扣好帽帶。</p>
</section>
<section>
<h3>2. 遵守交通號誌</h3>
<p>依照號誌及標誌行駛，不闖紅燈、不逆向行駛。</p>
</section>
<section>
<h3>3. 保持安全距離</h3>
<p>與前方車輛保持適當距離，避免突然煞車造成事故。</p>
</section>
<section>
<h3>4. 不超速、不搶快</h3>
<p>依照道路速限行駛，不為了趕時間而冒險。</p>
</section>
<section>
<h3>5. 雨天減速慢行</h3>
<p>雨天路面濕滑，應降低速度並避免急煞車。</p>
</section>
</main>
<footer>
<p>交通安全知識學習站｜安全上路，從知識開始！</p>
</footer>
