<main>
<h2>常見危險路口情況</h2>
<section>
<h3>1. 視線死角</h3>
<p>建築物或大型車輛可能遮擋視線，通過路口前應減速觀察。</p>
</section>
<section>
<h3>2. 未依號誌通行</h3>
<p>闖紅燈或搶快容易造成碰撞，應遵守交通號誌。</p>
</section>
<section>
<h3>3. 車輛轉彎未注意行人</h3>
<p>車輛轉彎時應注意行人及自行車，確實禮讓行人。</p>
</section>
<section>
<h3>4. 路口違規停車</h3>
<p>車輛違規停放可能影響視線，也會增加交通事故風險。</p>
</section>
<section>
<h3>5. 如何降低風險？</h3>
<p>接近路口時減速、注意周遭車輛，並確認安全後再通過。</p>
</section>
</main>
